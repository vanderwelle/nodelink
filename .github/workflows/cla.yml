# CLA Assistant Lite: asks PR authors to sign CLA.md; signatures live on the cla-signatures branch.
# Uses pull_request_target but never checks out or runs PR code.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/vanderwelle/nodelink/blob/main/CLA.md
          branch: cla-signatures
          allowlist: vanderwelle,dependabot[bot],github-actions[bot],renovate[bot],*[bot]
