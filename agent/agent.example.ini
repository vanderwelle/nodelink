# NodeLink agent configuration — /etc/nodelink-agent/agent.ini (mode 600; contains your bot secrets)
# After editing:  sudo systemctl restart nodelink-agent   and   sudo nodelink-agent test-alert

[node]
# NodeKit installs algod with this data directory (algod.net, algod.token, algod.admin.token live here)
data_dir = /var/lib/algorand
# Accounts to watch (comma-separated). Empty = every account with a participation key on this node
# (auto-detect needs the admin token; see use_admin_token).
accounts =
# auto|yes|no — the admin token is used ONLY for a read-only GET /v2/participation (keys on this node)
use_admin_token = auto

[agent]
# shown in every alert; default = hostname
node_name =
# seconds between checks (each check = 2-4 localhost requests + a few /proc reads)
poll_interval = 30

[reference]
# Compare your round with Nodely's public MainNet node (1 request / 5 min). no = never contact Nodely.
enabled = yes
interval = 300
# Count blocks proposed in the last 24 h for the daily summary (1 Nodely indexer request / account / day)
proposals = yes

[thresholds]
lag_rounds = 20
stall_seconds = 60
partkey_warn_days = 7
partkey_crit_days = 1
temp_warn_c = 75
temp_crit_c = 80
disk_warn_pct = 10
disk_crit_pct = 5
disk_warn_gb = 20
disk_crit_gb = 5
# consecutive checks a change must persist before an alert (temperature uses at least 3)
debounce_polls = 2
# repeat still-critical alerts every N hours (0 = never)
renotify_hours = 12

[alerts]
alert_on_startup = yes
daily_summary = yes
# local hour (0-23) for the daily summary
daily_summary_hour = 9

[telegram]
# From @BotFather (looks like 123456789:AA...). Then message your bot once and get your chat id:
#   curl -s https://api.telegram.org/bot<TOKEN>/getUpdates   -> "chat":{"id": ...}
bot_token =
chat_id =

[discord]
# Server Settings -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL
webhook_url =
