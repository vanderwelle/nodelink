# gitleaks config: default rules + allowlist for generated ARC-56 artifacts/clients, whose base64
# state-key names ("dmFsaWRfcm9vdHM=" = "valid_roots", ...) trip the generic-api-key rule.
[extend]
useDefault = true

[allowlist]
description = "generated Algorand app specs and clients (base64 state key names, not secrets)"
paths = [
  '''contracts/artifacts/NodeLinkProtocol\.arc56\.json''',
  '''contracts/clients/nodelink_protocol_client\.py''',
  '''shared/src/generated/NodeLinkProtocolClient\.ts''',
]
